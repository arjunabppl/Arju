<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Management App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            min-height: 90vh;
        }

        .sidebar {
            width: 220px;
            background: #111827;
            padding: 20px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            cursor: pointer;
            text-align: left;
        }

        .main {
            flex: 1;
            padding: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .number {
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Business Management Dashboard</h1>
    </div>

    <div class="container">

        <div class="sidebar">
            <button>Dashboard</button>
            <button>Sales Data</button>
            <button>Purchase Data</button>
            <button>Orders Pending</button>
            <button>Orders Completed</button>
            <button>Reports</button>
        </div>

        <div class="main">

            <h2>Dashboard</h2>
            <br>

            <div class="cards">

                <div class="card">
                    <h3>Total Sales</h3>
                    <div class="number">₹ 0</div>
                </div>

                <div class="card">
                    <h3>Total Purchase</h3>
                    <div class="number">₹ 0</div>
                </div>

                <div class="card">
                    <h3>Pending Orders</h3>
                    <div class="number">0</div>
                </div>

                <div class="card">
                    <h3>Completed Orders</h3>
                    <div class="number">0</div>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
