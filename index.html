<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Arj Papers lvt ltd</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Perpetua;
}

body {
    background: #f4f6f9;
}

.header {
    background: #1f2937;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    display: flex;
    min-height: calc(100vh - 75px);
}

.sidebar {
    width: 230px;
    background: #111827;
    padding: 20px;
}

.sidebar button {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
}

.sidebar button:hover {
    background: #d1d5db;
}

.main {
    flex: 1;
    padding: 30px;
}

.cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.card {
    background: white;
    padding: 25px;
    width: 220px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card h3 {
    margin-bottom: 15px;
}

.number {
    font-size: 28px;
    font-weight: bold;
}

.table-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #1f2937;
    color: white;
}
</style>
</head>

<body>

<div class="header">
    <h1>Arju Paper Pvt ltd </h1>
</div>

        <button onclick="showPage('pending')">⏳ Orders Pending</button>
        <button onclick="showPage('completed')">✅ Orders Completed</button>
        <button onclick="showPage('reports')">📑 Reports</button>
    </div>

    <div class="main" id="content">

        <h2>Dashboard</h2>
        <br>

        <div class="cards">

            </div>

            <div class="card">
                <h3>Total Purchase</h3>

            </div>

            <div class="card">

            </div>

            <div class="card">

    </div>

</div>
