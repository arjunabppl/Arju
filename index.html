 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
</head>
<body>
  <h2>Login</h2>

  <form id="loginForm">
    <label>Username:</label><br>
    <input type="text" id="username" placeholder="Enter username" required><br><br>

    <label>Password:</label><br>
    <input type="password" id="password" placeholder="Enter password" required><br><br>

    <button type="submit">Login</button>
  </form>

  <p id="msg"></p>

  <script>
    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const user = document.getElementById("arjun").value;
      const pass = document.getElementById("9392487985").value;

      if (user === "admin" && pass === "1234") {
        msg.style.color = "green";
        msg.textContent = "Login successful!";
      } else {
        msg.style.color = "red";
        msg.textContent = "Wrong username or password";
      }
    });
  </script>
</body>
</html>   
<title>Arju Papers Pvt Ltd</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Perpetua;
}

body {
    background: #f4f6f9;
}

.header {
    background: #1f2937;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    display: flex;
    min-height: calc(100vh - 75px);
}

.sidebar {
    width: 230px;
    background: #111827;
    padding: 20px;
}

.sidebar button {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
}

.sidebar button:hover {
    background: #d1d5db;
}

.main {
    flex: 1;
    padding: 30px;
}

.cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.card {
    background: white;
    padding: 25px;
    width: 220px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card h3 {
    margin-bottom: 15px;
}

.number {
    font-size: 28px;
    font-weight: bold;
}

.table-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #1f2937;
    color: white;
}

input,
select,
textarea {
    padding: 10px;
    width: 300px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.main button {
    padding: 10px 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

</style>
</head>

<body>

<div class="header">
    <h1>Arju Papers Pvt Ltd</h1>
</div>

<div class="container">

    <div class="sidebar">
        <button onclick="showPage('dashboard')">📊 Dashboard</button>
        <button onclick="showPage('sales')">💰 Sales Data</button>
        <button onclick="showPage('purchase')">🛒 Purchase Data</button>
        <button onclick="showPage('pending')">⏳ Orders Pending</button>
        <button onclick="showPage('completed')">✅ Orders Completed</button>
        <button onclick="showPage('reports')">📑 Reports</button>
    </div>

    <div class="main" id="content">

        <h2>Dashboard</h2>
        <br>

        <div class="cards">

            <div class="card">
                <h3>Total Sales</h3>
                <div class="number">₹ 0</div>
            </div>

            <div class="card">
                <h3>Total Purchase</h3>
                <div class="number">₹ 0</div>
            </div>

            <div class="card">
                <h3>Pending Orders</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Completed Orders</h3>
                <div class="number">0</div>
            </div>

        </div>

    </div>

</div>


<script>

function showPage(page) {

    let content = document.getElementById("content");

    if (page === "dashboard") {

        content.innerHTML = `
            <h2>Dashboard</h2>
            <br>

            <div class="cards">

                <div class="card">
                    <h3>Total Sales</h3>
                    <div class="number">₹ 0</div>
                </div>

                <div class="card">
                    <h3>Total Purchase</h3>
                    <div class="number">₹ 0</div>
                </div>

                <div class="card">
                    <h3>Pending Orders</h3>
                    <div class="number">0</div>
                </div>

                <div class="card">
                    <h3>Completed Orders</h3>
                    <div class="number">0</div>
                </div>

            </div>
        `;
    }


    else if (page === "sales") {

        content.innerHTML = `
            <h2>Sales Data</h2>
            <br>

            <button onclick="addSale()">➕ Add Sale</button>

            <div id="saleForm" style="display:none; margin-top:20px;">

                <h3>Add New Sale</h3>
                <br>

                <input type="date" id="saleDate">
                <br><br>

                <input type="text" id="itemName" placeholder="Item Name">
                <br><br>

                <input type="text" id="customerName" placeholder="Customer Name">
                <br><br>

                <input type="number" id="saleAmount" placeholder="Amount">
                <br><br>

                <button type="button" onclick="saveSale()">Save Sale</button>

            </div>
        `;
    }


    else if (page === "purchase") {

        content.innerHTML = `

            <h2>Purchase Data</h2>
            <br>

            <h3>➕ Add New Domestic Purchase</h3>
            <br>

            <label>📅 Purchase Date</label>
            <br>
            <input type="date" id="purchaseDate">

            <br><br>

            <label>🏢 Supplier Name</label>
            <br>
            <input type="text" id="supplierName" placeholder="Enter Supplier Name">

            <br><br>

            <label>📄 Bill / Invoice Number</label>
            <br>
            <input type="text" id="invoiceNumber" placeholder="Enter Invoice Number">

            <br><br>

            <label>📦 Item Name</label>
            <br>
            <input type="text" id="purchaseItem" placeholder="Enter Item Name">

            <br><br>

            <label>📏 Size / Specification</label>
            <br>
            <input type="text" id="specification" placeholder="Example: 80 GSM - 36x23">

            <br><br>

            <label>🔢 Quantity</label>
            <br>
            <input type="number" id="quantity" placeholder="Enter Quantity">

            <br><br>

            <label>⚖️ Unit</label>
            <br>

            <select id="unit">
                <option>KG</option>
                <option>TON</option>
                <option>SHEET</option>
                <option>REAM</option>
            </select>

            <br><br>

            <label>💰 Purchase Rate</label>
            <br>
            <input type="number" id="purchaseRate" placeholder="Enter Rate">

            <br><br>

            <label>💵 Total Amount</label>
            <br>
            <input type="number" id="totalAmount" placeholder="Total Amount">

            <br><br>

            <label>📝 Remarks</label>
            <br>

            <textarea id="remarks" placeholder="Optional Remarks"></textarea>

            <br><br>

            <button type="button" onclick="savePurchase()">
                💾 Save Purchase
            </button>

        `;
    }


    else if (page === "pending") {

        content.innerHTML = `
            <h2>Pending Orders</h2>
            <br>

            <div class="table-box">
                <p>No pending orders.</p>
            </div>
        `;
    }


    else if (page === "completed") {

        content.innerHTML = `
            <h2>Completed Orders</h2>
            <br>

            <div class="table-box">
                <p>No completed orders yet.</p>
            </div>
        `;
    }


    else if (page === "reports") {

        content.innerHTML = `
            <h2>Reports</h2>
            <br>

            <div class="table-box">
                <p>Reports will be available here.</p>
            </div>
        `;
    }

}


function addSale() {
    document.getElementById("saleForm").style.display = "block";
}


function saveSale() {
    alert("Sale Saved Successfully!");
}


function savePurchase() {
    alert("Purchase Saved Successfully!");
}

</script>

</body>
</html>
